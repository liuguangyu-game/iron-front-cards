:root{--paper:#e7d29c;--ink:#1d211c;--gold:#e2bd55;--green:#28392e;--red:#5a4030}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;color:var(--ink);font-family:ui-serif,"Noto Serif SC","Songti SC",serif;background:radial-gradient(ellipse at 50% 0,#6c7969,#15221d)}button,select{font:inherit}.wrap{max-width:1320px;margin:auto;padding:14px}.top,.controls{display:flex;justify-content:space-between;align-items:center;gap:10px}.top{color:#f5e4b3;border-bottom:2px solid #c4aa66;padding:0 0 10px}.brand{font-size:clamp(24px,5vw,39px);font-weight:900;letter-spacing:3px;text-shadow:2px 2px #142018}.sub,.row-title,.tag,.small,.stats,.ammo{font-family:Impact,"Arial Narrow",sans-serif;letter-spacing:.4px}.btn{border:2px solid #25271f;background:var(--paper);box-shadow:3px 3px #111;padding:10px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:42px}.btn:disabled{opacity:.45}.share{background:#f0d88e}.battle{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;gap:12px;margin:14px 0}.side{background:#dfcea0e8;border:3px solid #222a22;padding:9px;box-shadow:4px 5px #0008}.enemy.side{background:#bfc7a9e8}.name{font-weight:900}.hp{height:14px;background:#3b3026;border:2px solid #171914;margin:6px 0}.hp i{display:block;height:100%;background:#d95841;transition:.2s}.enemy .hp i{background:#798f72}.vs{text-align:center;font:700 34px Impact,"Arial Narrow",sans-serif;color:#f0d88e}.log{grid-column:1/-1;background:#1e2b24e8;color:#f3e0a7;border-left:4px solid var(--gold);padding:8px 11px;min-height:39px}.field{display:grid;grid-template-columns:1fr 1fr;gap:12px}.army{padding:9px;background:#263a30e8;color:#f5e4b7;border:3px solid #17221b}.army.enemy{background:#44392de8}.row-title{font-size:17px;font-weight:700;letter-spacing:.7px;margin:0 0 7px}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.lane{min-height:164px;border:2px dashed #bfaa6b;padding:5px}.lane.drop{outline:3px solid var(--gold);background:#fff2a g:18px;background:#112019e8}.modal.show{display:grid}.paper{max-width:580px;padding:22px;background:#e8d7a9;border:4px solid #292a21;box-shadow:10px 12px #090b09;text-align:center}.stamp{display:inline-block;padding:4px 12px;border:3px solid #a83025;color:#a83025;font:700 20px Impact,"Arial Narrow",sans-serif;transform:rotate(-5deg)}
@media(max-width:760px){.wrap{padding:9px;padding-bottom:calc(9px + env(safe-area-inset-bottom))}.top{align-items:flex-start}.top>div:last-child{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.battle,.field{grid-template-columns:1fr}.vs{display:none}.lane{min-height:148px}.unit{min-width:70px;width:calc(25% - 4px);min-height:112px;font-size:11px}.card{width:calc(50% - 5px);min-height:175px}.hand{min-height:170px}.controls{align-items:stretch;flex-direction:column}.controls .btn{width:100%}.btn{padding:9px}.empty{padding:25px 0}.paper{max-height:88dvh;overflow:auto;padding:18px}.hint{line-height:1.45}}@media(max-width:380px){.brand{font-size:25px}.unit{min-width:62px;font-size:10px}.card{min-height:160px}.art{font-size:21px}}@media(orientation:landscape) and (max-height:620px){.wrap{padding:7px}.battle{margin:7px 0}.lane{min-height:126px}.unit{min-height:98px}.hand{min-height:0}.card{min-height:150px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">铁幕前线</div><div class="sub">IRON FRONT · DRAG &amp; COMMAND</div></div><div><label class="small" for="difficulty">人机难度 </label><select id="difficulty" onchange="setDifficulty()"><option value="easy">新兵</option><option value="normal" selected>老兵</option><option value="hard">精英</option></select> <button class="btn" onclick="help()">玩法说明</button></div></header>
<section class="battle"><div class="side enemy" id="enemyHQ" onclick="targetHQ()" ondragover="allowDrop(event)" ondrop="dropHQ(event)"><div class="name">敌军指挥部（可选目标）</div><div class="hp"><i id="aiHp"></i></div><div class="small">完整度：<span id="aiNum"></span>/20</div></div><div class="vs">VS</div><div class="side"><div class="name">第 7 装甲军团</div><div class="hp"><i id="youHp"></i></div><div class="small">完整度：<span id="youNum"></span>/20</div></div><div class="log" id="log"></div></section>
<section class="field"><div class="army enemy"><div class="row-title">敌军战线（点击或拖入选定目标）</div><div class="lanes"><div class="lane"><div class="lane-title">前线 · 最多 4</div><div class="units" id="ef"></div></div><div class="lane"><div class="lane-title">支援阵线 · 最多 4</div><div class="units" id="es"></div></div></div></div><div class="army"><div class="row-title">我军战线</div><div class="lanes"><div class="lane" id="lane-yf" onclick="tapLane('f')" ondragover="allowDrop(event)" ondrop="dropLane(event,'f')"><div class="lane-title">前线 · 最多 4 · 可攻击</div><div class="units" id="yf"></div></div><div class="lane" id="lane-ys" onclick="tapLane('s')" ondragover="allowDrop(event)" ondrop="dropLane(event,'s')"><div class="lane-title">支援阵线 · 最多 4 · 新单位在此部署</div><div class="units" id="ys"></div></div></div></div></section>
<section class="board"><div class="row-title">你的指挥手册</div><div class="hand" id="hand"></div><div class="controls"><div><span class="ammo">补给 <span id="supply"></span>/10</span><div class="hint">电脑：拖拽前线单位或攻击功能牌到目标。手机：先点攻击者/功能牌，再点目标。攻击 2 补给，移动 1 补给。</div></div><button class="btn share" onclick="shareGame()">分享给好友</button><button class="btn" onclick="endTurn()">结束回合</button></div></section></main><div class="modal" id="modal"><div class="paper" id="modalText"></div></div>
<script>
const deck=[
{n:'步兵班',t:'陆军·步兵',a:'♟',c:2,atk:2,hp:4,kind:'infantry',x:'均衡的前线部队。'},{n:'工兵排',t:'陆军·工兵',a:'⚒',c:2,atk:1,hp:4,armor:1,kind:'infantry',x:'装甲 1，适合守线。'},{n:'侦察兵',t:'陆军·侦察',a:'◉',c:1,atk:1,hp:2,evade:.25,kind:'infantry',x:'闪避 25%，低补给部署。'},{n:'轻型坦克',t:'装甲·坦克',a:'▰',c:3,atk:3,hp:4,armor:1,kind:'tank',x:'装甲 1，稳定火力。'},{n:'重型坦克',t:'装甲·坦克',a:'▰',c:5,atk:4,hp:6,armor:2,kind:'tank',x:'装甲 2，坚固昂贵。'},{n:'战斗机',t:'空军·拦截',a:'✈',c:3,atk:3,hp:2,evade:.35,kind:'air',x:'闪避 35%，突击单位。'},{n:'轰炸机',t:'空军·轰炸',a:'✈',c:4,atk:4,hp:3,kind:'air',x:'高攻击、低耐久。'},{n:'野战总部',t:'总部·支援',a:'★',c:3,atk:0,hp:5,armor:1,kind:'hq',x:'每回合额外 +1 补给。'},
{n:'炮火支援',t:'攻击功能牌',a:'✹',c:2,kind:'order',bomb:2,x:'拖到敌军单位或总部：造成 2 点伤害。'},{n:'空袭命令',t:'攻击功能牌',a:'☄',c:3,kind:'order',bomb:3,x:'拖到敌军单位或总部：造成 3 点伤害。'},{n:'战地维修',t:'功能牌·维修',a:'⚙',c:1,kind:'order',heal:3,x:'点选后，再点我方单位，修复 3 耐久。'},{n:'紧急补给',t:'功能牌·后勤',a:'⬟',c:0,kind:'order',supply:3,x:'立即获得 3 点补给。'},{n:'烟幕掩护',t:'功能牌·战术',a:'☁',c:1,kind:'order',shield:true,x:'点选后，再点我方单位，闪避 +50%。'}];
let hp=20,ehp=20,supply=3,aiSupply=3,turn=1,hand=[],yf=[],ys=[],ef=[],es=[],selected=null,choice=null,over=false,difficulty='normal';
const cp=o=>({...o,maxHp:o.hp,used:false,shield:0}); const allY=()=>[...yf,...ys],allE=()=>[...ef,...es]; const say=x=>document.getElementById('log').textContent=x;
function draw(){while(hand.length<6)hand.push(cp(deck[Math.floor(Math.random()*deck.length)]));render()}
function get(s){if(!s)return null;return(s.side==='y'?(s.lane==='f'?yf:ys):(s.lane==='f'?ef:es))[s.i]}
function unit(v,side,lane,i){let sel=selected&&selected.side===side&&selected.lane===lane&&selected.i===i;return `<article class="unit ${v.kind} ${sel?'selected':''} ${v.used?'used':''}" draggable="${side==='y'}" ondragstart="dragUnit(event,'${side}','${lane}',${i})" onclick="event.stopPropagation();selectUnit('${side}','${lane}',${i})" ondragover="allowDrop(event)" ondrop="dropTarget(event,'${side}','${lane}',${i})"><div class="tag">${v.t}</div><b>${v.a} ${v.n}</b><div class="art">${v.a}</div><div class="mini"><span>⚔${v.atk}</span><span>♥${v.hp}/${v.maxHp}</span></div><div class="tag">${v.armor?'装甲 '+v.armor+' ':''}${v.evade?'闪避 '+Math.round(v.evade*100)+'% ':''}${v.shield?'烟幕':''}</div></article>`}
function lane(a,s,l){return a.map((v,i)=>unit(v,s,l,i)).join('')||'<span class="empty">空位</span>'}
function render(){['yf','ys','ef','es'].forEach(id=>document.getElementById(id).innerHTML=lane(id==='yf'?yf:id==='ys'?ys:id==='ef'?ef:es,id[0]==='y'?'y':'e',id[1]));document.getElementById('hand').innerHTML=hand.map((c,i)=>`<article class="card ${c.kind==='order'?'order':''} ${choice&&choice.type==='card'&&choice.i===i?'selected':''} ${c.c>supply||over?'disabled':''}" draggable="${c.bomb?'true':'false'}" ondragstart="dragCard(event,${i})" onclick="play(${i})"><div class="tag">${c.t}</div><h3>${c.n}</h3><div class="art">${c.a}</div><div class="stats"><span> ${c.kind==='order'?(c.bomb?'⚔ '+c.bomb:c.heal?'✚ '+c.heal:c.supply?'＋'+c.supply:'◈'):'⚔ '+c.atk+' ♥ '+c.hp}</span><span class="cost">${c.c}</span></div><div class="desc">${c.x}</div></article>`).join('');[['supply',supply],['youNum',hp],['aiNum',ehp]].forEach(x=>document.getElementById(x[0]).textContent=x[1]);document.getElementById('youHp').style.width=hp*5+'%';document.getElementById('aiHp').style.width=ehp*5+'%'}
function selectUnit(side,lane,i){if(over)return;let u=(side==='y'?(lane==='f'?yf:ys):(lane==='f'?ef:es))[i];if(choice){if(choice.type==='card'&&side==='y')return resolveCardTarget(choice.i,{side,lane,i});if(choice.type==='unit'&&side==='e')return resolveAttack(choice.source,{side,lane,i})}if(side==='y'){selected={side,lane,i};if(lane==='f'&&!u.used){choice={type:'unit',source:{side,lane,i}};say('攻击模式：已选中 '+u.n+'。现在点击敌军单位或敌军指挥部发动攻击。')}else say(lane==='f'?'该单位本回合已经行动，不能再次攻击。':'已选中 '+u.n+'：点击前线空白处，或拖到前线移动。')}else say('先选择我方前线单位或攻击功能牌，再选择此目标。');render()}
function play(i){let c=hand[i];if(over||c.c>supply)return;if(c.kind!=='order'){if(ys.length>=4){say('支援阵线已满，新单位不能部署。');return}supply-=c.c;hand.splice(i,1);ys.push(c);say('「'+c.n+'」部署至支援阵线。需花 1 补给移动到前线后才可攻击。');draw();return}if(c.supply){supply=Math.min(10,supply+c.supply);hand.splice(i,1);say('紧急补给抵达，获得 '+c.supply+' 补给。');draw();return}choice={type:'card',i};say(c.bomb?'已选中 '+c.n+'：选择或拖到敌军单位/敌军总部。':'已选中 '+c.n+'：请选择我方单位。');render()}
function resolveCardTarget(i,t){let c=hand[i];if(!c||c.c>supply)return;if(c.bomb){if(t.side==='y'){say('攻击功能牌只能攻击敌军。');return}supply-=c.c;hand.splice(i,1);if(t.hq)hitHQ(c.bomb,c.n);else damage(t,c.bomb,c.n);choice=null;draw();return}if(t.side!=='y'){say('该功能牌需要选择我方单位。');return}let u=get(t);supply-=c.c;hand.splice(i,1);if(c.heal){u.hp=Math.min(u.maxHp,u.hp+c.heal);say(u.n+' 修复 '+c.heal+' 点耐久。')}if(c.shield){u.shield=.5;say(u.n+' 获得烟幕掩护。')}choice=null;draw()}
function damage(t,d,src){if((t.evade||0)+(t.shield||0)>Math.random()){say(t.n+' 闪避了 '+src+'！');return}d=Math.max(1,d-(t.armor||0));t.hp-=d;say(src+' 命中 '+t.n+'，造成 '+d+' 点伤害。');if(t.hp<=0){[yf,ys,ef,es].forEach(a=>{let k=a.indexOf(t);if(k>=0)a.splice(k,1)});say(t.n+' 被摧毁！')}render()}
function hitHQ(d,src){ehp=Math.max(0,ehp-d);say(src+' 直击敌军指挥部，造成 '+d+' 点伤害！');if(!ehp)finish(true);render()}
function resolveAttack(s,t){let a=get(s);if(!a||a.used||s.lane!=='f'){say('只有未行动的前线单位可以攻击。');choice=null;render();return}if(supply<2){say('补给不足，攻击需要 2 点补给。');return}supply-=2;a.used=true;if(t.hq)hitHQ(a.atk,a.n);else{let defender=get(t);damage(defender,a.atk,a.n);if(defender.hp>0&&a.hp>0&&a.kind!=='air')damage(a,defender.atk,defender.n+' 反击')}choice=null;selected=null;render()}
function tapLane(to){if(selected&&selected.side==='y'&&selected.lane!==to)move(selected,to)}
function targetHQ(){if(choice){if(choice.type==='unit')resolveAttack(choice.source,{hq:true});else resolveCardTarget(choice.i,{hq:true,side:'e'})}else say('先点选或拖拽我方前线单位/攻击功能牌，再攻击敌军总部。')}
function move(s,to){let a=get(s);if(!a||a.used||supply<1)return say(a&&a.used?'该单位本回合已行动。':'移动需要 1 点补给。');let from=s.lane==='f'?yf:ys,dest=to==='f'?yf:ys;if(dest.length>=4)return say('目标阵线已满。');from.splice(s.i,1);dest.push(a);a.used=true;supply--;selected=null;choice=null;say(a.n+' 已移动到'+(to==='f'?'前线，可以攻击。':'支援阵线。'));render()}
function allowDrop(e){e.preventDefault()}function dragUnit(e,side,lane,i){if(side!=='y')return;e.dataTransfer.setData('text/plain',JSON.stringify({type:'unit',source:{side,lane,i}}));choice={type:'unit',source:{side,lane,i}}}function dragCard(e,i){let c=hand[i];if(!c.bomb)return;e.dataTransfer.setData('text/plain',JSON.stringify({type:'card',i}));choice={type:'card',i}}function readDrag(e){try{return JSON.parse(e.dataTransfer.getData('text/plain'))}catch{return choice}}
function dropTarget(e,side,lane,i){e.preventDefault();let d=readDrag(e);if(d?.type==='unit'&&side==='e')resolveAttack(d.source,{side,lane,i});else if(d?.type==='card'&&side==='e')resolveCardTarget(d.i,{side,lane,i})}function dropHQ(e){e.preventDefault();let d=readDrag(e);if(d?.type==='unit')resolveAttack(d.source,{hq:true});else if(d?.type==='card')resolveCardTarget(d.i,{hq:true,side:'e'})}function dropLane(e,to){e.preventDefault();let d=readDrag(e);if(d?.type==='unit'&&d.source.side==='y'&&d.source.lane!==to)move(d.source,to)}
function setDifficulty(){difficulty=document.getElementById('difficulty').value;say('人机难度已设为「'+({easy:'新兵',normal:'老兵',hard:'精英'}[difficulty])+'」。新难度从敌军下一回合生效。')}
async function shareGame(){const url=location.href;try{if(navigator.share){await navigator.share({title:'铁幕前线：卡牌游戏',text:'一起玩《铁幕前线》！',url});say('已打开分享面板，请选择微信好友。');return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(url);say('游戏链接已复制，请在微信聊天框中长按并粘贴发送。')}catch(e){prompt('复制这个游戏链接后，粘贴到微信发送给好友：',url)}}
function aiDamage(t,d,src){if(!t)return false;if((t.evade||0)+(t.shield||0)>Math.random()){say(t.n+' 闪避了 '+src+'！');return false}d=Math.max(1,d-(t.armor||0));t.hp-=d;say(src+' 命中 '+t.n+'，造成 '+d+' 点伤害。');if(t.hp<=0){[yf,ys,ef,es].forEach(a=>{let k=a.indexOf(t);if(k>=0)a.splice(k,1)});say(t.n+' 被摧毁！')}return true}
function aiHitHQ(d,src){hp=Math.max(0,hp-d);say(src+' 直击我军指挥部，造成 '+d+' 点伤害！');if(!hp)finish(false)}
function scoreTarget(u){let lethal=u.hp<=0?99:0;return lethal+(u.atk*5)+(u.kind==='air'?3:0)+(u.hp<=2?4:0)-(u.armor||0)*2}
function pickAiTarget(a){let targets=[...yf].sort((x,y)=>scoreTarget(y)-scoreTarget(x));let kill=targets.find(t=>a.atk>=t.hp+(t.armor||0));if(kill)return kill;if(ehp<=8&&!yf.length)return null;return targets[0]||null}
function aiBestCard(){let units=deck.filter(c=>['infantry','tank','air','hq'].includes(c.kind)&&c.c<=aiSupply);if(!units.length||es.length>=4)return null;let danger=yf.reduce((n,u)=>n+u.atk,0);let frontEmpty=!ef.length;units.sort((a,b)=>{let va=(a.atk*2+a.hp+(a.armor||0)*2)-(a.c*.25),vb=(b.atk*2+b.hp+(b.armor||0)*2)-(b.c*.25);if(frontEmpty&&danger){if(a.kind==='tank')va+=6;if(b.kind==='tank')vb+=6}if(ehp<=10){if(a.kind==='hq')va+=8;if(b.kind==='hq')vb+=8}return vb-va});return units[0]}
function aiDeploy(){let c=aiBestCard();if(!c)return false;aiSupply-=c.c;es.push(cp(c));say('敌军部署了 '+c.n+' 到支援阵线。');return true}
function aiMove(){if(ef.length>=4||aiSupply<1)return false;let candidates=es.filter(u=>!u.used&&u.kind!=='hq');if(!candidates.length)return false;let danger=yf.reduce((n,u)=>n+u.atk,0);candidates.sort((a,b)=>((b.kind==='tank'?5:0)+b.hp+b.atk+(danger?b.armor||0:0))-((a.kind==='tank'?5:0)+a.hp+a.atk+(danger?a.armor||0:0)));let u=candidates[0];es.splice(es.indexOf(u),1);ef.push(u);u.used=true;aiSupply--;say('敌军 '+u.n+' 调往前线，建立'+(u.kind==='tank'?'装甲':'')+'防线。');return true}
function aiAttack(){if(aiSupply<2)return false;let attackers=ef.filter(u=>!u.used);if(!attackers.length)return false;attackers.sort((a,b)=>(b.atk+b.hp*.25)-(a.atk+a.hp*.25));let a=attackers[0],t=pickAiTarget(a);a.used=true;aiSupply-=2;if(!t)aiHitHQ(a.atk,a.n);else{aiDamage(t,a.atk,a.n);if(t.hp>0&&a.hp>0&&a.kind!=='air')aiDamage(a,t.atk,t.n+' 反击')}return true}
function ai(){let limits={easy:1,normal:3,hard:5},actions=0,limit=limits[difficulty];while(!over&&actions<limit){let threat=yf.reduce((n,u)=>n+u.atk,0),did=false;if(threat>=5&&ef.length<2)did=aiMove();if(!did&&ef.length===0&&es.length)did=aiMove();if(!did&&es.length<4&&aiSupply>=2&&(ef.length===0||difficulty!=='easy'))did=aiDeploy();if(!did) did=aiAttack();if(!did&&es.length<4)did=aiDeploy();if(!did&&ef.length<4)did=aiMove();if(!did)break;actions++}render()}
function endTurn(){if(over)return;selected=choice=null;allY().forEach(x=>{x.used=false;x.shield=0});ai();if(over)return;allE().forEach(x=>{x.used=false;x.shield=0});turn++;let baseSupply=Math.min(10,turn+2);supply=Math.min(10,baseSupply+allY().filter(x=>x.kind==='hq').length);aiSupply=Math.min(10,baseSupply+allE().filter(x=>x.kind==='hq').length);draw();say('第 '+turn+' 回合：获得 '+supply+' 点补给。敌军补给 '+aiSupply+'。')}
function finish(win){over=true;render();document.getElementById('modalText').innerHTML=`<div class="stamp">${win?'战役胜利':'战役失利'}</div><h1>${win?'敌军指挥部被摧毁':'我军指挥部失守'}</h1><p>合理安排补给、移动与攻击目标。</p><button class="btn" onclick="location.reload()">重新开始</button>`;document.getElementById('modal').classList.add('show')}
function help(){document.getElementById('modalText').innerHTML='<h1>作战简报</h1><p><b>补给：</b>第 1 回合为 3 点；之后每回合基础补给 +1，直至第 8 回合达到 10 点后不再增加。野战总部额外提供 +1，但总补给仍最多 10 点。</p><p><b>部署：</b>所有新单位只能部署在支援阵线（最多 4）。</p><p><b>移动：</b>支援阵线单位移动到前线需 1 补给，并会占用本回合行动；前线单位才能攻击。</p><p><b>攻击：</b>攻击花 2 补给。电脑可将我方前线单位拖到任一敌军单位或敌军总部；手机点击我方前线单位，再点目标。攻击功能牌也可拖到敌军单位或总部。</p><p><b>反击：</b>陆军与坦克攻击敌军单位后，若双方仍在战场，敌军会以自身攻击力反击。战斗机、轰炸机不受反击；攻击总部与功能牌攻击不会触发反击。</p><p><b>人机难度：</b>新兵每回合最多 1 次行动；老兵最多 3 次，会优先建立前线、攻击高威胁目标；精英最多 5 次，会更主动地部署装甲防线并争取击杀。敌军也遵守补给、支援阵线和移动规则。</p><p><b>分享：</b>点击“分享给好友”，手机会优先调出系统分享（可选微信）；不支持时会下载 HTML 文件。好友收到后下载文件，再用浏览器打开即可游玩。</p><button class="btn" onclick="document.getElementById(\'modal\').classList.remove(\'show\')">明白了</button>';document.getElementById('modal').classList.add('show')}
draw();say('战役开始：新部队先部署在支援阵线，再移动到前线作战。');
</script></body></html>
